<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJ ESPORTS OFFICIAL - ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080b18;
    color:white;
    padding:18px;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:#00e5ff;
    margin-bottom:6px;
}

.header p{
    color:#aaa;
}

.card{
    background:#11172b;
    border:1px solid #26304d;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
}

h2{
    margin-bottom:15px;
    color:#00e5ff;
}

input,select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border-radius:9px;
    border:1px solid #303b5e;
    background:#080d1d;
    color:white;
    outline:none;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 16px;
    margin:5px 3px 5px 0;
    font-weight:bold;
    cursor:pointer;
}

.add{
    background:#00e5ff;
    color:#001018;
}

.approve{
    background:#20d878;
    color:#001b0d;
}

.reject{
    background:#ff4057;
    color:white;
}

.logout{
    background:#333b55;
    color:white;
}

.refresh{
    background:#6c5ce7;
    color:white;
}

.entry{
    background:#0b1122;
    border:1px solid #273250;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#26304d;
    margin:5px 0;
    font-size:13px;
}

.msg{
    margin-top:10px;
    color:#00e5ff;
}

.hidden{
    display:none;
}

.error{
    color:#ff6578;
}

.success{
    color:#35e28b;
}

.small{
    color:#999;
    font-size:13px;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>👑 AJ ESPORTS OFFICIAL</h1>
        <p>Admin Dashboard</p>
        <p id="adminEmail"></p>

        <button class="logout" onclick="logout()">
            🚪 LOGOUT
        </button>
    </div>


    <!-- LOGIN / ACCESS MESSAGE -->

    <div id="accessBox" class="card">
        Checking admin access...
    </div>


    <!-- ADMIN AREA -->

    <div id="adminArea" class="hidden">


        <!-- ADD TOURNAMENT -->

        <div class="card">

            <h2>➕ Add Tournament</h2>

            <input
                id="title"
                placeholder="Tournament Title"
            >

            <input
                id="entryFee"
                type="number"
                placeholder="Entry Fee"
            >

            <input
                id="perKill"
                type="number"
                placeholder="Per Kill"
                value="0"
            >

            <input
                id="prizePool"
                type="number"
                placeholder="Prize Pool"
            >

            <select id="matchStatus">
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
            </select>

            <button
                class="add"
                onclick="addTournament()"
            >
                ➕ ADD TOURNAMENT
            </button>

            <p id="addMessage" class="msg"></p>

        </div>


        <!-- TOURNAMENTS -->

        <div class="card">

            <h2>🏆 Tournaments</h2>

            <button
                class="refresh"
                onclick="loadMatches()"
            >
                🔄 REFRESH
            </button>

            <div id="matches">
                Loading...
            </div>

        </div>


        <!-- TRANSACTIONS -->

        <div class="card">

            <h2>💳 Payment Entries</h2>

            <button
                class="refresh"
                onclick="loadTransactions()"
            >
                🔄 REFRESH ENTRIES
            </button>

            <div id="transactions">
                Loading...
            </div>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://otjwqfxvaxfgjibwtlkq.supabase.co";

/*
   IMPORTANT:
   Yahan apna EXISTING SUPABASE ANON/PUBLISHABLE KEY
   paste karo.

   Service Role Key kabhi mat paste karna.
*/

const SUPABASE_ANON_KEY =
"PASTE_YOUR_EXISTING_ANON_KEY_HERE";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================
   ADMIN
========================= */

const ADMIN_EMAIL =
"bhartiamarjeet619@gmail.com";


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

    const accessBox =
        document.getElementById("accessBox");

    const adminArea =
        document.getElementById("adminArea");

    const {
        data,
        error
    } =
    await supabase.auth.getSession();


    if(error){

        accessBox.innerHTML =
        `<p class="error">
        ❌ Session error: ${escapeHTML(error.message)}
        </p>`;

        return;
    }


    const session =
        data.session;


    if(!session){

        accessBox.innerHTML =
        `<p class="error">
        ❌ Please login first.
        </p>
        <br>
        <button class="add"
        onclick="goHome()">
        LOGIN
        </button>`;

        return;
    }


    const email =
        session.user.email || "";


    document.getElementById(
        "adminEmail"
    ).innerText =
        email;


    if(
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        accessBox.innerHTML =
        `<p class="error">
        ❌ Admin access denied.
        </p>`;

        await supabase.auth.signOut();

        return;
    }


    accessBox.innerHTML =
    `<p class="success">
    ✅ Admin verified successfully.
    </p>`;


    adminArea.classList.remove(
        "hidden"
    );


    await loadMatches();

    await loadTransactions();

}


/* =========================
   ADD TOURNAMENT
========================= */

async function addTournament(){

    const title =
        document.getElementById(
            "title"
        ).value.trim();

    const entryFee =
        document.getElementById(
            "entryFee"
        ).value;

    const perKill =
        document.getElementById(
            "perKill"
        ).value || 0;

    const prizePool =
        document.getElementById(
            "prizePool"
        ).value;

    const status =
        document.getElementById(
            "matchStatus"
        ).value;

    const message =
        document.getElementById(
            "addMessage"
        );


    if(
        !title ||
        entryFee === "" ||
        prizePool === ""
    ){

        message.innerHTML =
        `<span class="error">
        Please fill Title, Entry Fee and Prize Pool.
        </span>`;

        return;
    }


    const { error } =
        await supabase
        .from("Matches")
        .insert({

            Title: title,

            "Entry fee":
                Number(entryFee),

            "Per kill":
                Number(perKill),

            "Prize pool":
                Number(prizePool),

            Status: status

        });


    if(error){

        message.innerHTML =
        `<span class="error">
        ❌ ${escapeHTML(error.message)}
        </span>`;

        return;
    }


    message.innerHTML =
    `<span class="success">
    ✅ Tournament added successfully!
    </span>`;


    document.getElementById(
        "title"
    ).value = "";

    document.getElementById(
        "entryFee"
    ).value = "";

    document.getElementById(
        "perKill"
    ).value = "0";

    document.getElementById(
        "prizePool"
    ).value = "";


    await loadMatches();

}


/* =========================
   LOAD MATCHES
========================= */

async function loadMatches(){

    const box =
        document.getElementById(
            "matches"
        );


    const {
        data,
        error
    } =
    await supabase
    .from("Matches")
    .select(
        'id,Title,"Entry fee","Per kill","Prize pool",Status,"Room id","Room pass"'
    )
    .order(
        "id",
        { ascending:false }
    );


    if(error){

        box.innerHTML =
        `<p class="error">
        ❌ ${escapeHTML(error.message)}
        </p>`;

        return;
    }


    if(!data || data.length === 0){

        box.innerHTML =
        "<p>No tournaments found.</p>";

        return;
    }


    box.innerHTML = "";


    data.forEach(function(match){

        const div =
            document.createElement("div");

        div.className =
            "entry";


        div.innerHTML = `

            <h3>
                ${escapeHTML(match.Title || "Tournament")}
            </h3>

            <p class="small">
                Match ID: ${match.id}
            </p>

            <p>
                💰 Entry:
                ₹${match["Entry fee"] || 0}
            </p>

            <p>
                🎯 Per Kill:
                ₹${match["Per kill"] || 0}
            </p>

            <p>
                🏆 Prize:
                ₹${match["Prize pool"] || 0}
            </p>

            <p class="status">
                ${escapeHTML(match.Status || "-")}
            </p>

            <input
                id="room_match_${match.id}"
                placeholder="Room ID"
                value="${escapeHTML(match["Room id"] || "")}"
            >

            <input
                id="pass_match_${match.id}"
                placeholder="Room Password"
                value="${escapeHTML(match["Room pass"] || "")}"
            >

            <button
                class="approve"
                onclick="saveRoom(${match.id})"
            >
                💾 SAVE ROOM
            </button>

        `;


        box.appendChild(div);

    });

}


/* =========================
   SAVE ROOM
========================= */

async function saveRoom(matchId){

    const room =
        document.getElementById(
            `room_match_${matchId}`
        ).value.trim();

    const pass =
        document.getElementById(
            `pass_match_${matchId}`
        ).value.trim();


    if(!room || !pass){

        alert(
            "Room ID and Room Password required."
        );

        return;
    }


    const { error } =
        await supabase
        .from("Matches")
        .update({

            "Room id": room,
            "Room pass": pass

        })
        .eq(
            "id",
            matchId
        );


    if(error){

        alert(
            "❌ " +
            error.message
        );

        return;
    }


    alert(
        "✅ Room details saved!"
    );


    await loadMatches();

}


/* =========================
   LOAD TRANSACTIONS
========================= */

async function loadTransactions(){

    const box =
        document.getElementById(
            "transactions"
        );


    box.innerHTML =
        "Loading entries...";


    const {
        data,
        error
    } =
    await supabase
    .from("Transactions")
    .select(
        'id,Phone,Amount,Type,Status,"Payment id",Payment,User_id,Match_id'
    )
    .order(
        "id",
        { ascending:false }
    );


    if(error){

        box.innerHTML =
        `<p class="error">
        ❌ ${escapeHTML(error.message)}
        </p>`;

        return;
    }


    if(!data || data.length === 0){

        box.innerHTML =
        "<p>No payment entries.</p>";

        return;
    }


    box.innerHTML = "";


    data.forEach(function(t){

        const div =
            document.createElement("div");

        div.className =
            "entry";


        div.innerHTML = `

            <p>
                <b>Entry ID:</b>
                ${t.id}
            </p>

            <p>
                📱 <b>Phone:</b>
                ${escapeHTML(t.Phone || "-")}
            </p>

            <p>
                💰 <b>Amount:</b>
                ₹${t.Amount || 0}
            </p>

            <p>
                🧾 <b>Payment ID:</b>
                ${escapeHTML(t["Payment id"] || "-")}
            </p>

            <p>
                🎮 <b>Match ID:</b>
                ${t.Match_id || "-"}
            </p>

            <p>
                <span class="status">
                    ${escapeHTML(t.Status || "-")}
                </span>
            </p>

            ${
                t.Status !== "Approved"
                ?
                `
                <button
                    class="approve"
                    onclick="approveEntry(${t.id}, ${t.Match_id})"
                >
                    ✅ APPROVE
                </button>

                <button
                    class="reject"
                    onclick="rejectEntry(${t.id})"
                >
                    ❌ REJECT
                </button>
                `
                :
                `
                <p class="success">
                    ✅ Already Approved
                </p>
                `
            }

        `;


        box.appendChild(div);

    });

}


/* =========================
   APPROVE ENTRY
========================= */

async function approveEntry(
    transactionId,
    matchId
){

    if(!matchId){

        alert(
            "Match ID missing."
        );

        return;
    }


    const roomInput =
        document.getElementById(
            `room_match_${matchId}`
        );


    const passInput =
        document.getElementById(
            `pass_match_${matchId}`
        );


    if(!roomInput || !passInput){

        alert(
            "Please set Room ID and Password in the tournament section first."
        );

        return;
    }


    const room =
        roomInput.value.trim();

    const pass =
        passInput.value.trim();


    if(!room || !pass){

        alert(
            "Room ID and Room Password required."
        );

        return;
    }


    /* SAVE ROOM */

    const {
        error: roomError
    } =
    await supabase
    .from("Matches")
    .update({

        "Room id": room,
        "Room pass": pass

    })
    .eq(
        "id",
        matchId
    );


    if(roomError){

        alert(
            roomError.message
        );

        return;
    }


    /* APPROVE PAYMENT */

    const {
        error
    } =
    await supabase
    .from("Transactions")
    .update({

        Status: "Approved"

    })
    .eq(
        "id",
        transactionId
    );


    if(error){

        alert(
            error.message
        );

        return;
    }


    alert(
        "✅ Payment approved!"
    );


    await loadTransactions();

}


/* =========================
   REJECT ENTRY
========================= */

async function rejectEntry(id){

    if(
        !confirm(
            "Reject this payment?"
        )
    ){

        return;
    }


    const { error } =
    await supabase
    .from("Transactions")
    .update({

        Status: "Rejected"

    })
    .eq(
        "id",
        id
    );


    if(error){

        alert(
            error.message
        );

        return;
    }


    alert(
        "❌ Payment rejected."
    );


    await loadTransactions();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

    await supabase.auth.signOut();

    location.reload();

}


/* =========================
   HOME
========================= */

function goHome(){

    location.href =
        "index.html";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

checkAdmin();

</script>

</body>
</html>
